[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watermarkforge"
version = "0.1.0"
description = "Fairness-controlled benchmark of LLM text watermarks + a channel-diverse flagship scheme (pure NumPy, offline, deterministic)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "chenxing@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
test = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
watermarkforge = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core", "data", "watermark", "detect", "eval", "pipeline", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
